name: poolio_db

services:
  postgres:
    image: postgres:18.3-alpine
    env_file:
      - .env
    volumes:
      - poolio_data:/var/lib/postgresql/
      - ./flyway/data:/tmp/data
    ports:
      - '5431:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 5s
      retries: 5

  flyway:
    build: ./flyway
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  poolio_data: